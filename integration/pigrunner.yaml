# configs/env/pigrunner.yaml  --  modelled on dmc_proprio.yaml (vector obs, no pixels)
task: pigrunner_v0
steps: 2e5
env_num: 16
eval_episode_num: 10
action_repeat: 1
train_ratio: 512
time_limit: 1000        # r2dreamer's wrappers.TimeLimit owns the 1000-step cap

seed: ${seed}
device: ${device}

size: [64, 64]          # unused: nothing renders during training
encoder:
  mlp_keys: '.*'        # the 11-number state vector goes to the MLP
  cnn_keys: '$^'        # matches nothing, so no pixels ever reach the model
decoder:
  mlp_keys: '.*'
  cnn_keys: '$^'
